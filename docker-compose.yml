services:
  apex-portal:
    build: .
    container_name: apex-identity-portal
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"          # localhost only: demo mode must not be exposed to a network
    environment:
      # Demo mode enables server-side keygen/signing for the wallet. Set to 0 for anything shared.
      - APEX_DEMO_MODE=${APEX_DEMO_MODE:-1}
      # Optional: SECRET_KEY=<64 hex chars>. If unset a random one is generated and persisted in /data.
    volumes:
      - apex-data:/data
volumes:
  apex-data:
